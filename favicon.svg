<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Body -->
  <ellipse cx="16" cy="21" rx="10" ry="11" fill="#1f2a3c"/>
  <!-- White belly -->
  <ellipse cx="16" cy="23" rx="6.5" ry="7.5" fill="#faf5e9"/>
  <!-- Head -->
  <circle cx="16" cy="9" r="7.5" fill="#1f2a3c"/>
  <!-- Eyes (white sclera) -->
  <circle cx="13" cy="8" r="2.2" fill="white"/>
  <circle cx="19" cy="8" r="2.2" fill="white"/>
  <!-- Pupils -->
  <circle cx="13.4" cy="8.2" r="1.1" fill="#111827"/>
  <circle cx="19.4" cy="8.2" r="1.1" fill="#111827"/>
  <!-- Eye shine -->
  <circle cx="13.9" cy="7.6" r="0.45" fill="white"/>
  <circle cx="19.9" cy="7.6" r="0.45" fill="white"/>
  <!-- Beak -->
  <path d="M13.5 11 L16 14.5 L18.5 11 Z" fill="#b98b2e"/>
  <!-- Wings -->
  <ellipse cx="6" cy="22" rx="2.8" ry="6.5" fill="#1f2a3c" transform="rotate(-12 6 22)"/>
  <ellipse cx="26" cy="22" rx="2.8" ry="6.5" fill="#1f2a3c" transform="rotate(12 26 22)"/>
  <!-- Feet -->
  <ellipse cx="12.5" cy="31" rx="3.8" ry="1.4" fill="#b98b2e"/>
  <ellipse cx="19.5" cy="31" rx="3.8" ry="1.4" fill="#b98b2e"/>
</svg>
